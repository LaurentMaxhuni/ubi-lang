name: Compiler and portable packages

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install Rust tools
        run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets --locked
        timeout-minutes: 5
      - name: Build portable targets
        run: |
          cargo run --locked -- package --root examples/v1 --target web
          cargo run --locked -- package --root examples/v1 --target cli
          cargo run --locked -- package --root examples/v1 --target desktop
          cargo run --locked -- package --root examples/v1 --target mobile

  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24 restricts Chromium user namespaces; preserve the sandbox.
        # Migrate before ubuntu-22.04 retires on 2027-04-17.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo run --locked -- package --root examples/v1 --target desktop
      - run: npm ci
        working-directory: examples/v1/.ubi-dist/desktop
      - name: Verify native desktop UI
        if: runner.os != 'Linux'
        run: npm run smoke
        working-directory: examples/v1/.ubi-dist/desktop
      - name: Verify native desktop UI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run smoke
        working-directory: examples/v1/.ubi-dist/desktop
      - run: npm run package
        working-directory: examples/v1/.ubi-dist/desktop
      - name: Launch packaged desktop executable
        if: runner.os != 'Linux'
        run: node scripts/verify-desktop.mjs
      - name: Launch packaged desktop executable on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/verify-desktop.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: examples/v1/.ubi-dist/desktop/out/
          retention-days: 7

  mobile-projects:
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo run --locked -- package --root examples/v1 --target mobile
      - run: npm ci
        working-directory: examples/v1/.ubi-dist/mobile
      - run: npm run ${{ matrix.target }}
        working-directory: examples/v1/.ubi-dist/mobile
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android build SDK using runner licenses
        if: matrix.target == 'android'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" < /dev/null'
      - name: Build Android debug APK
        if: matrix.target == 'android'
        run: ./gradlew --no-daemon assembleDebug
        working-directory: examples/v1/.ubi-dist/mobile/android
      - name: Build iOS simulator application
        if: matrix.target == 'ios'
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
        working-directory: examples/v1/.ubi-dist/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-${{ matrix.target }}
          path: |
            examples/v1/.ubi-dist/mobile/android/app/build/outputs/apk/debug/*.apk
            examples/v1/.ubi-dist/mobile/build/Build/Products/Debug-iphonesimulator/*.app
          retention-days: 7
