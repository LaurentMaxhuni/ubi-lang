<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ubi tasks</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header><a class="wordmark" href="/" aria-label="Ubi tasks home">ubi<span aria-hidden="true">.</span></a><p>A little space to get things done.</p></header>
    <section aria-labelledby="heading">
      <h1 id="heading">What’s on your list?</h1>
      <form id="add-task">
        <label for="title">New task</label>
        <div class="input-row"><input id="title" name="title" placeholder="Something worth doing" maxlength="240" required autocomplete="off"><button type="submit">Add task <span aria-hidden="true">↗</span></button></div>
      </form>
      <p id="status" role="status" aria-live="polite">Ready when you are.</p>
      <p id="error" role="alert" hidden></p>
      <ul id="tasks" aria-label="Your tasks"></ul>
      <p id="empty">Your first task starts here. Add something above.</p>
    </section>
    <footer><span>One thing at a time.</span><span>Tasks reset when this page reloads.</span></footer>
  </main>
</body>
</html>
